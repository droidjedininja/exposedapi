name: ExposedAPI checks

on:
  push:
    paths:
      - "exposedapi/**"
      - "tests/**"
      - "pyproject.toml"
      - "demo/**"
      - ".github/workflows/demo-ci.yml"
  pull_request:
    paths:
      - "exposedapi/**"
      - "tests/**"
      - "pyproject.toml"
      - "demo/**"
      - ".github/workflows/demo-ci.yml"

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CLI
        run: python -m pip install -e .
      - name: Run CLI tests
        run: python -m unittest discover -s tests -v
      - name: Check command
        run: exposedapi --help

  demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Run smoke tests
        run: node tests/smoke.cjs
